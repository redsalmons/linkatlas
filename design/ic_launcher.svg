<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <radialGradient id="bg" cx="50%" cy="36%" r="78%">
      <stop offset="0%" stop-color="#27307A"/>
      <stop offset="52%" stop-color="#161C48"/>
      <stop offset="100%" stop-color="#0A0E24"/>
    </radialGradient>
    <linearGradient id="shieldGrad" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0%" stop-color="#22D3EE"/>
      <stop offset="55%" stop-color="#818CF8"/>
      <stop offset="100%" stop-color="#C084FC"/>
    </linearGradient>
    <linearGradient id="linkGrad" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#C084FC" stop-opacity="0.95"/>
    </linearGradient>
    <radialGradient id="nodeGrad" cx="35%" cy="30%" r="85%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="38%" stop-color="#67E8F9"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </radialGradient>
    <radialGradient id="nodeGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#22D3EE" stop-opacity="0.55"/>
      <stop offset="55%" stop-color="#8B5CF6" stop-opacity="0.22"/>
      <stop offset="100%" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="16" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="bigGlow" x="-120%" y="-120%" width="340%" height="340%">
      <feGaussianBlur stdDeviation="42" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1024" height="1024" fill="url(#bg)"/>

  <!-- star field -->
  <g fill="#FFFFFF">
    <circle cx="170" cy="180" r="3.5" opacity="0.55"/>
    <circle cx="852" cy="150" r="2.5" opacity="0.4"/>
    <circle cx="880" cy="430" r="3" opacity="0.5"/>
    <circle cx="140" cy="640" r="2.5" opacity="0.35"/>
    <circle cx="760" cy="870" r="3.5" opacity="0.45"/>
    <circle cx="230" cy="880" r="2" opacity="0.4"/>
    <circle cx="60" cy="430" r="2" opacity="0.3"/>
    <circle cx="950" cy="660" r="2.5" opacity="0.4"/>
  </g>

  <!-- orbit arc -->
  <g transform="rotate(-16 512 540)">
    <ellipse cx="512" cy="540" rx="430" ry="215" fill="none"
             stroke="url(#linkGrad)" stroke-width="7" opacity="0.5"
             stroke-dasharray="4 26" stroke-linecap="round"/>
  </g>

  <!-- shield body -->
  <path d="M512 292 C402 292 336 338 336 432 L336 584 C336 704 432 778 512 828 C592 778 688 704 688 584 L688 432 C688 338 622 292 512 292 Z"
        fill="#818CF8" fill-opacity="0.08"
        stroke="url(#shieldGrad)" stroke-width="24"
        stroke-linejoin="round" filter="url(#glow)"/>

  <!-- neural links inside shield -->
  <g stroke="url(#linkGrad)" stroke-width="9" stroke-linecap="round"
     fill="none" opacity="0.9" filter="url(#glow)">
    <path d="M512 408 Q452 452 410 512"/>
    <path d="M512 408 Q574 452 616 512"/>
    <path d="M410 540 Q458 598 506 648"/>
    <path d="M616 540 Q568 598 520 648"/>
    <path d="M410 512 Q512 556 616 512"/>
  </g>

  <!-- node halos + nodes -->
  <g>
    <circle cx="512" cy="392" r="72" fill="url(#nodeGlow)"/>
    <circle cx="398" cy="522" r="64" fill="url(#nodeGlow)"/>
    <circle cx="628" cy="522" r="64" fill="url(#nodeGlow)"/>
    <circle cx="512" cy="668" r="72" fill="url(#nodeGlow)"/>
  </g>
  <g filter="url(#glow)">
    <circle cx="512" cy="392" r="36" fill="url(#nodeGrad)"/>
    <circle cx="398" cy="522" r="30" fill="url(#nodeGrad)"/>
    <circle cx="628" cy="522" r="30" fill="url(#nodeGrad)"/>
    <circle cx="512" cy="668" r="36" fill="url(#nodeGrad)"/>
  </g>
</svg>
