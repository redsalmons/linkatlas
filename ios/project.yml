name: LinkAtlas
include:
  - path: project.local.yml
    optional: true
attributes:
  knownRegions: [en, zh-Hans, zh-Hant, ja, de, fr, it, fi, ru]
options:
  bundleIdPrefix: com.redsalmons
  deploymentTarget:
    iOS: "16.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
    TARGETED_DEVICE_FAMILY: "1"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  LinkAtlas:
    type: application
    platform: iOS
    sources:
      - App
      - ../third_party/libmaxminddb/src
      - path: ../third_party/geoip
        excludes: [data, README.md]
      - path: ../third_party/geoip/data/city-names.tsv
        buildPhase: resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: 连线图志
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
        UIRequiresFullScreen: true
        NSLocationWhenInUseUsageDescription: 仅用于在地图上标出你的起点，不保存、不上传
        LookupServiceURL: $(LOOKUP_SERVICE_URL)
        LookupServiceURLLAN: $(LOOKUP_SERVICE_URL_LAN)
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    entitlements:
      path: App/LinkAtlas.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
        com.apple.developer.devicecheck.appattest-environment: "$(APP_ATTEST_ENVIRONMENT)"
    settings:
      configs:
        Debug:
          APP_ATTEST_ENVIRONMENT: development
          LOOKUP_SERVICE_URL: https://testapp.freedomsalmon.com
        Release:
          APP_ATTEST_ENVIRONMENT: production
          LOOKUP_SERVICE_URL: https://app.freedomsalmon.com
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redsalmons.linkatlas
        SWIFT_OBJC_BRIDGING_HEADER: App/App-Bridging-Header.h
        USE_HEADERMAP: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../third_party/libmaxminddb/include"
          - "$(SRCROOT)/../third_party/libmaxminddb/src"
          - "$(SRCROOT)/../third_party/geoip"
    dependencies:
      - target: PacketTunnel
  PacketTunnel:
    type: app-extension
    platform: iOS
    sources:
      - PacketTunnel
      - path: ../core/src
      - path: ../core/analyzer
      - path: ../core/include
        buildPhase: none
      - path: ../core/third_party/lwip/core
    info:
      path: PacketTunnel/Info.plist
      properties:
        CFBundleDevelopmentRegion: en
        CFBundleDisplayName: 连线图志 Tunnel
        NSExtension:
          NSExtensionPointIdentifier: com.apple.networkextension.packet-tunnel
          NSExtensionPrincipalClass: $(PRODUCT_MODULE_NAME).PacketTunnelProvider
    entitlements:
      path: PacketTunnel/PacketTunnel.entitlements
      properties:
        com.apple.developer.networking.networkextension: [packet-tunnel-provider]
    settings:
      configs:
        Debug:
          GCC_PREPROCESSOR_DEFINITIONS: ["$(inherited)", "LINKATLAS_DPI_LOG=1"]
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.redsalmons.linkatlas.tunnel
        OTHER_LDFLAGS: ["$(inherited)", "-lresolv"]
        SWIFT_OBJC_BRIDGING_HEADER: PacketTunnel/PacketTunnel-Bridging-Header.h
        USE_HEADERMAP: NO
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        HEADER_SEARCH_PATHS:
          - "$(SRCROOT)/../core/src"
          - "$(SRCROOT)/../core/include"
          - "$(SRCROOT)/../core/third_party/lwip/include"
          - "$(SRCROOT)/../core/third_party/lwip/ports/include"
        CLANG_CXX_LANGUAGE_STANDARD: c++17
        GCC_C_LANGUAGE_STANDARD: gnu11
        CLANG_ENABLE_MODULES: NO  # lwIP and Darwin both define struct ip6_hdr; modules reject that
schemes:
  LinkAtlas:
    build:
      targets:
        LinkAtlas: all
    run:
      config: Debug
      storeKitConfiguration: App/LinkAtlas.storekit
